<style>
  /* レイアウト：縦長9:16のステージを中央に置き、下に「楽譜」と操作ボタン */

  .stage-wrap { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: center; }

  .start:focus-visible .start-pill { outline: 3px solid var(--accent); outline-offset: 3px; }
  .safe {

  .safe .label { position: absolute; font-size: 11px; color: #a3204d; padding: 4px 6px; }
  .bottom { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 8px; }

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>

<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

/* ==========================================================
   設定（ここを書き換えると見た目・音・リズムが変わります）
   ========================================================== */
const LOOP = 10;                 // 1周の長さ（秒）
const COLS = 4, ROWS = 2;        // キーの並び（4×2 = 8キー）
const PALETTES = {               // キーキャップの色（左上から右へ）
  oil:   { name: "Oil slick", keys: ["#2d4bff", "#3a86ff", "#2fc6ff", "#4ef0e6", "#6b48ff", "#5c7cff", "#a35cff", "#e070ff"] },
  candy: { name: "Candy", keys: ["#ff9f45", "#ff5d8f", "#9b6cff", "#4d7cff", "#8fe04a", "#2fd4d9", "#ffd84d", "#dfeeff"] },
};
let paletteName = "oil";
const keyColor = i => PALETTES[paletteName].keys[i];
// 本物の録音に差し替えるときは、ここに音声ファイル名を入れます（空なら合成音）
const SAMPLE_URLS = { press: [], release: [] };
const BGM_VOLUME = 0.5;         // BGMの音量（1 = 元の大きさ、0.5 = 半分）

/* ==========================================================
   楽譜：何秒にどのキーを押すか。映像と音の両方がこれを見る
   ========================================================== */
function rng(seed) {             // 同じ番号なら毎回同じ「ランダム」になる
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeScore(seed) {
  const r = rng(seed);
  const n = COLS * ROWS;
  const events = [];
  const busyUntil = new Array(n).fill(-1);
  let t = 0.02, last = -1;
  while (t < LOOP - 0.35) {
    // 次に押すキー：直前と同じキーは少なめ、まだ戻りきっていないキーは避ける
    let key = -1;
    for (let tries = 0; tries < 20; tries++) {
      const k = Math.floor(r() * n);
      if (k === last && r() > 0.12) continue;
      if (busyUntil[k] > t) continue;
      key = k; break;
    }
    if (key >= 0) {
      const hold = 0.05 + r() * 0.08;
      events.push({ t, key, hold, vel: 0.7 + r() * 0.3 });
      busyUntil[key] = t + hold + 0.3;
      last = key;
    }
    // 間隔：ふつうの間／素早い連打／ひと呼吸 を混ぜる
    const roll = r();
    if (roll < 0.28) t += 0.07 + r() * 0.06;
    else if (roll < 0.9) t += 0.17 + r() * 0.38;
    else t += 0.6 + r() * 0.4;
  }
  // ループのつなぎ目：最初の打鍵と近すぎる最後の打鍵を外す
  return events.filter(e => {
    const first = events.find(f => f.key === e.key);
    return e === first || e.t + e.hold + 0.3 < LOOP + first.t;
  });
}

let seed = 1;
let score = makeScore(seed);

/* 音を鳴らす瞬間：映像でキーが底に着く時刻と、上に戻りきる時刻 */
const BOTTOM_AT = 0.028;
const TOP_AT = Math.PI / 44;                     // 戻りの揺れが最初にてっぺんを通る時刻（約0.07秒）

/* キーがどれだけ沈んでいるか（0 = 上、1 = 底）を時刻から計算 */
function depression(key, loopT) {
  let d = 0;
  for (const e of score) {
    if (e.key !== key) continue;
    let dt = loopT - e.t;
    if (dt < 0) dt += LOOP;                    // 前の周の打鍵の余韻
    if (dt > e.hold + 0.6) continue;
    let v;
    if (dt < BOTTOM_AT) v = Math.pow(dt / BOTTOM_AT, 1.6) * e.vel;          // 押し込み
    else if (dt < e.hold) v = e.vel;                                 // 底についている
    else {                                                           // バネで戻る（少し跳ねる）
      const u = dt - e.hold;
      v = e.vel * Math.exp(-26 * u) * Math.cos(22 * u);
    }
    if (Math.abs(v) > Math.abs(d)) d = v;
  }
  return Math.max(-0.12, d);
}

/* ==========================================================
   音（Web Audio）
   ========================================================== */
let ctx = null, master = null, noiseBuf = null, keyBus = null, bgmBus = null, bgmDelay = null;
let bgmOn = true;
const samples = { press: [], release: [] };

function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.002; comp.release.value = 0.08;
  master = ctx.createGain(); master.gain.value = 0.9;
  // 小さな部屋の響き
  const verb = ctx.createConvolver();
  const len = Math.floor(ctx.sampleRate * 0.35);
  const ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const ch = ir.getChannelData(c);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
  }
  verb.buffer = ir;
  const wet = ctx.createGain(); wet.gain.value = 0.12;
  master.connect(comp); master.connect(verb); verb.connect(wet); wet.connect(comp);
  comp.connect(ctx.destination);

  keyBus = ctx.createGain(); keyBus.connect(master);
  // BGM：長い響き＋やまびこで、遠くで鳴っているように
  bgmBus = ctx.createGain(); bgmBus.gain.value = bgmOn ? BGM_VOLUME : 0;
  const bgmVerb = ctx.createConvolver();
  const blen = Math.floor(ctx.sampleRate * 2.8);
  const bir = ctx.createBuffer(2, blen, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const ch = bir.getChannelData(c);
    for (let i = 0; i < blen; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / blen, 2.5);
  }
  bgmVerb.buffer = bir;
  const bgmWet = ctx.createGain(); bgmWet.gain.value = 0.5;
  bgmDelay = ctx.createDelay(1); bgmDelay.delayTime.value = BEAT * 0.75;
  const fb = ctx.createGain(); fb.gain.value = 0.35;
  const dlp = ctx.createBiquadFilter(); dlp.type = "lowpass"; dlp.frequency.value = 2500;
  bgmDelay.connect(dlp); dlp.connect(fb); fb.connect(bgmDelay);
  const dOut = ctx.createGain(); dOut.gain.value = 0.4; dlp.connect(dOut); dOut.connect(bgmBus);
  bgmBus.connect(comp); bgmBus.connect(bgmVerb); bgmVerb.connect(bgmWet); bgmWet.connect(comp);

  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  for (const kind of ["press", "release"]) {
    for (const url of SAMPLE_URLS[kind]) {
      fetch(url).then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b))
        .then(buf => samples[kind].push(buf)).catch(() => {});
    }
  }
}

function panFor(key) { return ((key % COLS) / (COLS - 1) - 0.5) * 0.9; }

function noiseBurst(when, out, { freq, q, gain, decay, type = "bandpass" }) {
  const src = ctx.createBufferSource(); src.buffer = noiseBuf;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(gain, when + 0.0008);
  g.gain.exponentialRampToValueAtTime(0.0001, when + decay);
  src.connect(f); f.connect(g); g.connect(out);
  src.start(when, Math.random() * 0.1); src.stop(when + decay + 0.02);
}

/* 音の種類：ボタンで切り替えて聞き比べる */
const SOUND_PRESETS = {
  thock: { name: "Thock" },   // 低めで丸い。クリーミーな打鍵音
  click: { name: "Clicky" },   // 高めで硬い。青軸のようなクリック感
  pop:   { name: "Bubble pop" },   // 水っぽい。泡がはじけるような音
};
let soundName = "thock";

function tone(when, out, { f0, f1, dur, gain, type = "sine", attack = 0.001 }) {
  const o = ctx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, when);
  o.frequency.exponentialRampToValueAtTime(f1, when + dur * 0.7);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(gain, when + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(out); o.start(when); o.stop(when + dur + 0.02);
}

/* kind: "down"＝底に当たる音 / "up"＝戻りきった音 */
function playSound(kind, key, when, vel) {
  const pan = ctx.createStereoPanner(); pan.pan.value = panFor(key);
  pan.connect(keyBus);
  const list = samples[kind === "down" ? "press" : "release"];
  if (list.length) {                               // 録音素材がある場合
    const src = ctx.createBufferSource();
    src.buffer = list[Math.floor(Math.random() * list.length)];
    src.playbackRate.value = 0.96 + Math.random() * 0.08;
    const g = ctx.createGain(); g.gain.value = vel;
    src.connect(g); g.connect(pan); src.start(when);
    return;
  }
  // キーごとに少しずつ音の高さを変える（キャップの個体差のイメージ）
  const k = 1 + (key - 3.5) * 0.03 + (Math.random() - 0.5) * 0.05;
  const v = vel;
  if (soundName === "thock") {
    if (kind === "down") {
      noiseBurst(when, pan, { freq: 2300 * k, q: 1.2, gain: 0.35 * v, decay: 0.014 });
      noiseBurst(when + 0.001, pan, { freq: 720 * k, q: 6, gain: 0.8 * v, decay: 0.07 });       // ケースの「コ」
      tone(when, pan, { f0: 190 * k, f1: 110 * k, dur: 0.09, gain: 0.5 * v, type: "triangle" }); // 底の「ト」
    } else {
      noiseBurst(when, pan, { freq: 3200 * k, q: 1.5, gain: 0.16 * v, decay: 0.01 });
      noiseBurst(when, pan, { freq: 1100 * k, q: 6, gain: 0.3 * v, decay: 0.035 });
    }
  } else if (soundName === "click") {
    if (kind === "down") {
      noiseBurst(when - 0.012, pan, { freq: 5200 * k, q: 2, gain: 0.5 * v, decay: 0.008 });     // 押し始めの「カ」
      noiseBurst(when, pan, { freq: 4200 * k, q: 1.6, gain: 0.6 * v, decay: 0.015 });           // 「チッ」
      noiseBurst(when + 0.001, pan, { freq: 1500 * k, q: 4, gain: 0.45 * v, decay: 0.04 });
      tone(when, pan, { f0: 4600 * k, f1: 4500 * k, dur: 0.12, gain: 0.025 * v });                // バネの「チーン」
    } else {
      noiseBurst(when, pan, { freq: 5600 * k, q: 2, gain: 0.35 * v, decay: 0.009 });
      noiseBurst(when + 0.001, pan, { freq: 2000 * k, q: 5, gain: 0.25 * v, decay: 0.03 });
    }
  } else {
    if (kind === "down") {
      tone(when, pan, { f0: 1100 * k, f1: 380 * k, dur: 0.07, gain: 0.45 * v });                  // 「ポ」
      noiseBurst(when, pan, { freq: 2600 * k, q: 3, gain: 0.25 * v, decay: 0.012 });
      tone(when, pan, { f0: 170 * k, f1: 120 * k, dur: 0.06, gain: 0.3 * v, type: "triangle" });
    } else {
      tone(when, pan, { f0: 700 * k, f1: 1300 * k, dur: 0.05, gain: 0.2 * v });                   // 戻りの「コ」（上がる音）
    }
  }
}

/* ==========================================================
   BGM：ドリーミーな小さな曲（96BPM・4小節＝ちょうど10秒）
   ========================================================== */
const BEAT = LOOP / 16;                          // 1拍 = 0.625秒
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const CHORDS = [                                  // Fmaj9 → Em7 → Dm9 → Cmaj9
  [53, 57, 60, 64, 67], [52, 55, 59, 62, 66], [50, 53, 57, 60, 64], [48, 52, 55, 59, 62],
];
const ARP = [0, 2, 4, 3, 1, 3, 4, null];         // 8分音符のオルゴール（null は休み）
const bgmEvents = [];
CHORDS.forEach((ch, bar) => {
  const t = bar * 4 * BEAT;
  bgmEvents.push({ t, type: "pad", notes: ch });
  bgmEvents.push({ t, type: "bass", note: ch[0] - 12 });
  ARP.forEach((idx, i) => {
    if (idx === null || (bar === 3 && i > 5)) return;
    bgmEvents.push({ t: t + i * BEAT / 2, type: "bell", note: ch[idx] + 12 + (i === 2 ? 12 : 0), pan: i % 2 ? 0.35 : -0.35 });
  });
});
bgmEvents.push({ t: 0, type: "bell", note: 88, pan: 0.5 });   // ループ頭のキラッ

function playBgm(e, when) {
  if (e.type === "pad") {
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900; f.Q.value = 0.5;
    const g = ctx.createGain();
    const len = 4 * BEAT;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(0.06, when + 0.8);
    g.gain.setValueAtTime(0.06, when + len - 0.2);
    g.gain.linearRampToValueAtTime(0, when + len + 1.0);
    f.connect(g); g.connect(bgmBus);
    for (const n of e.notes) for (const det of [-7, 7]) {
      const o = ctx.createOscillator(); o.type = "sawtooth";
      o.frequency.value = midi(n); o.detune.value = det;
      o.connect(f); o.start(when); o.stop(when + len + 1.1);
    }
  } else if (e.type === "bass") {
    const o = ctx.createOscillator(); o.frequency.value = midi(e.note);
    const g = ctx.createGain(); const len = 4 * BEAT;
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(0.12, when + 0.15);
    g.gain.setValueAtTime(0.12, when + len - 0.3); g.gain.linearRampToValueAtTime(0, when + len + 0.1);
    o.connect(g); g.connect(bgmBus); o.start(when); o.stop(when + len + 0.15);
  } else {                                        // オルゴール風のベル
    const pan = ctx.createStereoPanner(); pan.pan.value = e.pan; pan.connect(bgmBus); pan.connect(bgmDelay);
    const fq = midi(e.note);
    for (const [mul, amp, dec] of [[1, 0.09, 1.4], [2, 0.03, 0.6], [4.2, 0.012, 0.25]]) {
      const o = ctx.createOscillator(); o.frequency.value = fq * mul;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(amp, when + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dec);
      o.connect(g); g.connect(pan); o.start(when); o.stop(when + dec + 0.05);
    }
  }
}

/* 少し先の打鍵を前もって予約しておく（タイミングのズレを防ぐ） */
let t0 = 0, cursor = 0;
function startClock() { t0 = ctx.currentTime + 0.12; cursor = t0 - 0.001; }
function scheduler() {
  if (!ctx || ctx.state !== "running") return;
  const end = ctx.currentTime + 0.2;
  const nFrom = Math.floor((cursor - t0) / LOOP), nTo = Math.floor((end - t0) / LOOP);
  for (let n = Math.max(0, nFrom); n <= nTo; n++) {
    for (const e of score) {
      const gt = t0 + n * LOOP + e.t;
      if (gt > cursor && gt <= end) {
        playSound("down", e.key, gt + BOTTOM_AT, e.vel);           // キーが底に着いた瞬間
        playSound("up", e.key, gt + e.hold + TOP_AT, e.vel * 0.9); // バネで上に戻りきった瞬間
      }
    }
    for (const e of bgmEvents) {
      const gt = t0 + n * LOOP + e.t;
      if (gt > cursor && gt <= end) playBgm(e, gt);
    }
  }
  cursor = end;
}

/* 映像の時計：音が鳴り始めたら音の時計に合わせる */
const perf0 = performance.now();
function loopTime() {
  if (ctx && ctx.state !== "closed" && started) {
    const lat = ctx.outputLatency || ctx.baseLatency || 0;
    const g = ctx.currentTime - t0 - lat;
    return ((g % LOOP) + LOOP) % LOOP;
  }
  return ((performance.now() - perf0) / 1000) % LOOP;
}

/* ==========================================================
   3Dシーン
   ========================================================== */
const canvas = document.getElementById("three");

  fragmentShader: `
    uniform float uPh; varying vec2 vUv;
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec2 mod289(vec2 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec3 permute(vec3 x){return mod289(((x*34.0)+1.0)*x);}
    float snoise(vec2 v){
      const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
      vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx);
      vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
      vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1; i=mod289(i);
      vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
      vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0); m=m*m; m=m*m;

      vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw;
      return 130.0*dot(m,g);

    float fbm(vec2 p){ float f=0.0, a=0.55; for(int i=0;i<3;i++){ f+=a*snoise(p); p*=1.9; a*=0.45; } return f; }
    vec3 ramp(float x){                                   // 油膜の色：コバルト→水色→ラベンダー→ピンク→コバルト
      x = fract(x) * 4.0;

function roundedRect(w, h, r, x = 0, y = 0) {
  const s = new THREE.Shape();

  s.lineTo(l + w - r, b); s.quadraticCurveTo(l + w, b, l + w, b + r);
  s.lineTo(l + w, b + h - r); s.quadraticCurveTo(l + w, b + h, l + w - r, b + h);
  s.lineTo(l + r, b + h); s.quadraticCurveTo(l, b + h, l, b + h - r);
  s.lineTo(l, b + r); s.quadraticCurveTo(l, b, l + r, b);

}

/* 打鍵の振動を足し合わせて揺れを計算（10秒で必ず元に戻るので、ループの継ぎ目が出ない） */
function impulse(t, omega, tau, delay, weight) {
  let s = 0;
  for (const e of score) {
    let dt = t - e.t - delay;
    dt = ((dt % LOOP) + LOOP) % LOOP;
    if (dt > tau * 5) continue;
    s += weight(e) * Math.exp(-dt / tau) * Math.sin(omega * dt);
  }
  return s;
}

  const m = new THREE.Mesh(starGeo, starMat);
  m.scale.setScalar(d.s); m.position.set(...d.p);
  scene.add(m);
  return { m, d };
});

/* ==========================================================
   毎フレームの更新
   ========================================================== */
function update(t) {
  const ph = (t / LOOP) * Math.PI * 2;          // 1周でちょうど元に戻る動きにする
  bgMat.uniforms.uPh.value = ph;
  let sumD = 0;
  for (let i = 0; i < keys.length; i++) {
    const d = depression(i, t);
    sumD += Math.max(0, d);
    const k = keys[i];
    k.moving.position.y = -d * TRAVEL;
    k.spring.scale.y = 0.35 - d * TRAVEL;      // バネが縮む
    const glow = Math.max(0, d);
    k.capMat.emissiveIntensity = glow * 0.35;
    k.stemMat.emissiveIntensity = glow * 1.2;
  }
  // 宙に浮いてゆっくり上下。打鍵でほんの少し沈む
  board.position.y = Math.sin(ph) * 0.08 - sumD * 0.015;
  board.rotation.z = Math.sin(ph) * 0.015;
  // チャームの揺れ：根元は小さく、先は遅れて大きく揺れる
  seg1.rotation.x = 0.05 * Math.sin(ph) + impulse(t, 9, 0.7, 0, e => 0.09 * e.vel);
  seg1.rotation.z = 0.04 * Math.sin(2 * ph + 1) + impulse(t, 8, 0.7, 0, e => 0.05 * side(e));
  seg2.rotation.x = 0.04 * Math.sin(ph + 0.8) + impulse(t, 12, 0.55, 0.05, e => 0.16 * e.vel);
  seg2.rotation.z = 0.03 * Math.sin(2 * ph + 2) + impulse(t, 11, 0.55, 0.05, e => 0.08 * side(e));
  heart.rotation.y = 0.6 * Math.sin(ph) + impulse(t, 5, 1.0, 0.03, e => 0.25 * side(e));
  letters.forEach((m, i) => { m.rotation.y = 0.3 * Math.sin(ph + i) + impulse(t, 7, 0.8, 0.02 * i, e => 0.2 * side(e)); });
  for (const { m, d } of glints) {
    const tw = Math.pow(Math.max(0, Math.sin(ph * d.k + d.off)), 8);
    m.scale.setScalar(d.s * (0.2 + tw)); m.material.opacity = tw;
  }
  for (const { m, d } of bokehs) {
    m.position.x = d.p[0] + Math.cos(ph * d.k + d.off) * 0.5;
    m.position.y = d.p[1] + Math.sin(ph * d.k + d.off) * 0.5;
  }
  // カメラ：ゆっくり左右に揺れる（10秒で1往復）
  const az = Math.sin(ph) * 0.07, el = 0.68 + Math.sin(ph * 2) * 0.03;
  const dist = 19;
  camera.position.set(Math.sin(az) * Math.cos(el) * dist, Math.sin(el) * dist, Math.cos(az) * Math.cos(el) * dist);
  camera.lookAt(0, 0.35, 0.2);
  for (const { m, d } of stars) {
    const a = ph + d.ph * Math.PI * 2;
    m.position.y = d.p[1] + Math.sin(a) * 0.15;
    m.rotation.set(-0.7 + 0.15 * Math.sin(a), Math.sin(a) * 0.9, 0.2 + d.ph);
  }
}

/* サイズ合わせ（常に9:16） */
const stage = document.getElementById("stage"), wrap = document.getElementById("stageWrap");
function resize() {
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  const w = Math.min(ww, wh * 9 / 16), h = w * 16 / 9;
  stage.style.width = w + "px"; stage.style.height = h + "px";
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  sizeScore();
}

/* ==========================================================
   楽譜の表示
   ========================================================== */
const sc = document.getElementById("scoreCanvas"), sg = sc.getContext("2d");
function sizeScore() {
  const r = window.devicePixelRatio || 1;
  sc.width = sc.clientWidth * r; sc.height = sc.clientHeight * r;
  sg.setTransform(r, 0, 0, r, 0, 0);
}
function drawScore(t) {
  const w = sc.clientWidth, h = sc.clientHeight, lane = (h - 12) / (COLS * ROWS);
  sg.clearRect(0, 0, w, h);
  sg.fillStyle = "#eef1ff"; sg.fillRect(0, 0, w, h - 12);
  sg.fillStyle = "#57629c"; sg.font = "10px system-ui"; sg.textBaseline = "bottom";
  for (let s = 0; s <= LOOP; s += 2) {
    const x = (s / LOOP) * (w - 1);
    sg.fillRect(x, 0, 1, h - 12);
    sg.textAlign = s === 0 ? "left" : s === LOOP ? "right" : "center";
    sg.fillText(s + "s", x, h);
  }
  for (const e of score) {
    sg.fillStyle = keyColor(e.key) === "#dfeeff" ? "#9fb6dd" : keyColor(e.key);
    const x = (e.t / LOOP) * w, y = e.key * lane;
    sg.fillRect(x, y + 0.5, Math.max(2, (e.hold / LOOP) * w), lane - 1);
  }
  sg.fillStyle = "#ff5d8f"; sg.fillRect((t / LOOP) * w - 1, 0, 2, h - 12);
}

/* ==========================================================
   操作
   ========================================================== */
let started = false;
const startBtn = document.getElementById("start");
const playBtn = document.getElementById("playBtn");
startBtn.addEventListener("click", async () => {
  if (!ctx) initAudio();
  await ctx.resume();
  startClock();
  started = true;
  startBtn.hidden = true;
  playBtn.disabled = false;
  scheduler();
});
setInterval(scheduler, 25);

playBtn.addEventListener("click", async () => {
  if (!ctx) return;
  if (ctx.state === "running") { await ctx.suspend(); playBtn.textContent = "Play"; }
  else { await ctx.resume(); playBtn.textContent = "Pause"; }
});

document.getElementById("shuffleBtn").addEventListener("click", () => {
  seed = 1 + Math.floor(Math.random() * 9999);
  score = makeScore(seed);
  document.getElementById("seedLabel").textContent = "#" + String(seed).padStart(4, "0");
  if (ctx && started) startClock();      // 新しいパターンを頭から
});

const soundBtn = document.getElementById("soundBtn");
soundBtn.addEventListener("click", () => {
  const names = Object.keys(SOUND_PRESETS);
  soundName = names[(names.indexOf(soundName) + 1) % names.length];
  soundBtn.textContent = "Sound: " + SOUND_PRESETS[soundName].name;
});
const bgmBtn = document.getElementById("bgmBtn");
bgmBtn.addEventListener("click", () => {
  bgmOn = !bgmOn;
  bgmBtn.textContent = "BGM: " + (bgmOn ? "On" : "Off");
  bgmBtn.setAttribute("aria-pressed", String(bgmOn));
  if (bgmBus) bgmBus.gain.setTargetAtTime(bgmOn ? BGM_VOLUME : 0, ctx.currentTime, 0.1);
});

const paletteBtn = document.getElementById("paletteBtn");
paletteBtn.addEventListener("click", () => {
  paletteName = paletteName === "oil" ? "candy" : "oil";
  paletteBtn.textContent = "Color: " + PALETTES[paletteName].name;
  applyPalette();
});

const safeBtn = document.getElementById("safeBtn"), safe = document.getElementById("safe");
safeBtn.addEventListener("click", () => {
  safe.hidden = !safe.hidden;
  safeBtn.setAttribute("aria-pressed", String(!safe.hidden));
});

window.addEventListener("resize", resize);
resize();
renderer.setAnimationLoop(() => {
  const t = loopTime();
  update(t);
  renderer.render(scene, camera);
  drawScore(t);
});
</script>
