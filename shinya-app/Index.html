<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}

/* Layout: summary strip on top, calendar (or vertical schedule) left, day panel right; stacks on phones */
:root{
  --bg:#f4f5f9; --surface:#ffffff; --fg:#1c2033; --muted:#5d6380; --line:#dfe2ee;
  --night:#3d3f8f; --night-soft:#e4e5f6; --night-ink:#2c2e70;
  --ok:#2f7a4f; --ok-soft:#e1f1e7; --warn:#a85d12; --warn-soft:#fbeedd; --bad:#b0302a; --bad-soft:#f8e3e1;
  --draft:#6b7090; --draft-soft:#eceef5; --weekend:#f0f1f7;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131c; --surface:#1b1d2a; --fg:#e7e8f2; --muted:#9a9fbd; --line:#2d3044;
  --night:#9fa3ff; --night-soft:#272a4d; --night-ink:#c9cbff;
  --ok:#6fcf97; --ok-soft:#1d3327; --warn:#f0b25e; --warn-soft:#3a2c17; --bad:#f08a82; --bad-soft:#3d1f1d;
  --draft:#a3a8c6; --draft-soft:#262839; --weekend:#171926; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131c; --surface:#1b1d2a; --fg:#e7e8f2; --muted:#9a9fbd; --line:#2d3044;
  --night:#9fa3ff; --night-soft:#272a4d; --night-ink:#c9cbff;
  --ok:#6fcf97; --ok-soft:#1d3327; --warn:#f0b25e; --warn-soft:#3a2c17; --bad:#f08a82; --bad-soft:#3d1f1d;
  --draft:#a3a8c6; --draft-soft:#262839; --weekend:#171926; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6;padding:0 16px 96px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:20px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--night);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:22px;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.sample{display:inline-block;font-size:11px;letter-spacing:.06em;background:var(--warn-soft);color:var(--warn);padding:1px 8px;border-radius:4px;margin-left:6px;vertical-align:middle}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--night);color:var(--surface);font-weight:700}

/* summary */
.summary{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.tile h2{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 4px;font-weight:500}
.big{font-size:28px;font-weight:600;line-height:1.2}
.big small{font-size:14px;color:var(--muted);font-weight:500}
.gauge{position:relative;height:14px;background:var(--draft-soft);border-radius:4px;margin:10px 0 22px;overflow:visible}
.gauge .seg-a,.gauge .seg-p,.gauge .seg-d{position:absolute;top:0;bottom:0}
.gauge .seg-a{background:var(--night);border-radius:4px 0 0 4px}
.gauge .seg-p{background:color-mix(in srgb,var(--night) 55%,transparent)}
.gauge .seg-d{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--night) 35%,transparent) 0 4px,transparent 4px 8px)}
.mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warn)}
.mark.law{background:var(--bad)}
.mark span{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:10.5px;white-space:nowrap;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.state{font-size:12.5px;margin-top:4px}
.state.warn{color:var(--warn)} .state.bad{color:var(--bad)} .state.ok{color:var(--ok)}
.breakdown{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted);margin-top:6px}
.breakdown div{display:flex;justify-content:space-between;gap:8px}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.cal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.cal-head strong{font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 64px}
.dow{font-size:11.5px;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line)}
.dow.wk{background:var(--weekend)}
.cell{min-height:98px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 5px 6px;display:flex;flex-direction:column;gap:3px;background:transparent;text-align:left;border-top:0;border-left:0;min-width:0}
.cell.off{background:var(--bg);cursor:default}
.cell.we{background:var(--weekend)}
.cell.sel{outline:2px solid var(--night);outline-offset:-2px}
.cell .d{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.cell .d b{font-weight:600}
.cell.today .d b{background:var(--night);color:var(--surface);border-radius:999px;padding:0 6px}
.cell .act{font-size:11px;color:var(--muted)}
.chip{display:block;font-size:11px;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.st-approved{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.st-pending{background:var(--night-soft);border-color:var(--night);color:var(--fg)}
.st-draft{background:var(--draft-soft);border-color:var(--draft);color:var(--fg);border-left-style:dashed}
.st-rejected{background:var(--bad-soft);border-color:var(--bad);color:var(--fg);text-decoration:line-through}
.cmt{font-size:11px;color:var(--night-ink)}
.wk-total{border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);padding:4px}
.wk-total .num{font-size:15px;color:var(--fg)}
.wk-total.over{background:var(--warn-soft)}
.wk-total.over .num{color:var(--warn)}

/* vertical list */
.list{display:flex;flex-direction:column}
.wk-head{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.wk-head.over{background:var(--warn-soft);color:var(--warn)}
.row{display:grid;grid-template-columns:72px minmax(0,1fr) 64px;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row.we{background:var(--weekend)}
.row.sel{outline:2px solid var(--night);outline-offset:-2px}
.row .dt{font-size:13px}
.row .dt.today b{color:var(--night)}
.row .items{display:flex;flex-direction:column;gap:3px;min-width:0}
.row .items .chip{font-size:12.5px;padding:2px 8px}
.row .h{text-align:right;font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:12px}

/* panel */
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-size:17px}
.panel h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.entry{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;border-left:4px solid}
.entry .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.entry .t b{font-size:15px}
.pill{font-size:11px;border-radius:999px;padding:1px 9px;font-weight:700;white-space:nowrap}
.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.pending{background:var(--night-soft);color:var(--night-ink)}
.pill.draft{background:var(--draft-soft);color:var(--draft)}
.pill.rejected{background:var(--bad-soft);color:var(--bad)}
.entry .meta{font-size:12px;color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 12px;font-size:13px}
.btn.primary{background:var(--night);border-color:var(--night);color:var(--surface);font-weight:700}
.btn.okb{background:var(--ok);border-color:var(--ok);color:var(--surface);font-weight:700}
.btn.badb{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
form.add{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form.add label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
form.add .full{grid-column:1/-1}
select,input[type=text],textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 8px;width:100%;font-size:13.5px}
textarea{resize:vertical;min-height:56px}
.calc{font-size:12.5px;background:var(--night-soft);border-radius:7px;padding:6px 10px;color:var(--night-ink)}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{display:flex;flex-direction:column;gap:1px;padding:7px 10px;border-radius:8px;background:var(--bg);font-size:13px}
.msg.mgr{background:var(--warn-soft)}
.msg .who{font-size:11.5px;color:var(--muted)}
.dayact{font-size:13px;color:var(--muted)}

/* bottom bar + sheet */
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:5}
.bar .in{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar .msgtxt{font-size:13px;color:var(--muted)}
.sheet-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--fg) 35%,transparent);z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:12px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 32px);overflow:auto}
.sheet h3{margin:0;font-size:17px}
.sheet table{width:100%;border-collapse:collapse;font-size:13px}
.sheet td{padding:4px 0;border-bottom:1px solid var(--line)}
.sheet td:last-child{text-align:right}
.alert{border-radius:8px;padding:8px 12px;font-size:13px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:20}

@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}
  .summary{grid-template-columns:1fr 1fr}
  .summary .tile:first-child{grid-column:1/-1}
}
@media (max-width:560px){
  .cal{grid-template-columns:repeat(7,minmax(0,1fr)) 44px}
  .cell{min-height:64px;padding:3px}
  .chip{font-size:10px;padding:0 3px}
  .cell .cmt,.cell .act{display:none}
  .wk-total{font-size:10px}
  .wk-total .num{font-size:12px}
  .row{grid-template-columns:56px minmax(0,1fr) 48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


.monthnav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.monthnav button{border:0;background:transparent;padding:4px 10px;font-size:15px;border-radius:6px}
.monthnav button:disabled{opacity:.3;cursor:not-allowed}
.monthnav strong{font-size:14px;min-width:98px;text-align:center}
.closed{background:var(--draft-soft);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--muted)}
.closed b{color:var(--fg)}
.flag{font-size:10.5px;color:var(--bad);font-weight:700}
.memsel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.memsel select{width:auto;background:var(--surface)}
.summary.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tbl-wrap{overflow-x:auto}
table.team{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
table.team th{font-size:11.5px;letter-spacing:.04em;color:var(--muted);font-weight:500;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.team td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.team tbody tr{cursor:pointer}
table.team tbody tr:hover{background:var(--bg)}
table.team td.r{text-align:right}
.mini{position:relative;height:10px;background:var(--draft-soft);border-radius:3px;min-width:140px}
.mini .fill{position:absolute;left:0;top:0;bottom:0;background:var(--night);border-radius:3px}
.mini .fill.warn{background:var(--warn)}
.mini .fill.bad{background:var(--bad)}
.mini .m40{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn)}
.ot{display:flex;align-items:center;gap:10px}
.ot .num{min-width:46px;text-align:right}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:4px;padding:1px 7px;white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.info{background:var(--night-soft);color:var(--night-ink)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.st-furi{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.chip.hol{font-weight:700}
.hname{font-size:10.5px;color:var(--bad)}
.avg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.avg select{width:auto}
.namecell{font-weight:700;white-space:nowrap}
.tile .big.bad{color:var(--bad)} .tile .big.warn{color:var(--warn)}
@media (max-width:900px){.summary.four{grid-template-columns:1fr 1fr}.summary.four .tile:first-child{grid-column:auto}}

.busy{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.busy span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 18px;font-size:13px}
.fatal{max-width:640px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
.fatal h1{font-size:18px;margin:0 0 8px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <h1 id="h1">深夜・休日出勤カレンダー</h1>
      <div class="sub" id="sub">読み込み中…</div>
    </div>
    <div class="toggles">
      <div class="seg" role="group" aria-label="立場" id="roleseg" hidden>
        <button id="r-member" aria-pressed="true">自分の申請</button>
        <button id="r-mgr" aria-pressed="false">マネージャー</button>
      </div>
      <button class="btn" id="reload" title="最新の内容を読み込みます">更新</button>
    </div>
  </header>

  <div class="toggles" style="justify-content:space-between;align-items:center">
    <div class="toggles" style="align-items:center">
      <div class="monthnav" aria-label="表示する月">
        <button id="m-prev" aria-label="前の月">‹</button><strong id="m-label"></strong><button id="m-next" aria-label="次の月">›</button>
      </div>
      <div class="seg" role="group" aria-label="画面" id="tabs" hidden>
        <button id="t-team" aria-pressed="true">チーム一覧</button>
        <button id="t-cal" aria-pressed="false">個人のカレンダー</button>
      </div>
      <label class="memsel" id="memsel" hidden>担当者 <select id="mem"></select></label>
    </div>
    <div class="seg" role="group" aria-label="表示" id="viewseg">
      <button id="v-cal" aria-pressed="true">カレンダー</button>
      <button id="v-list" aria-pressed="false">縦スケジュール</button>
    </div>
  </div>

  <div class="closed" id="closed" hidden></div>
  <section class="summary" id="summary"></section>

  <div class="main" id="mainwrap">
    <section class="card" id="board"></section>
    <aside class="card panel" id="panel"></aside>
  </div>
  <section class="card" id="team" hidden></section>
</div>

<div class="fatal" id="fatal" hidden></div>
<div class="bar"><div class="in" id="bar"></div></div>
<div class="sheet-bg" id="sheet" hidden></div>
<div class="busy" id="busy" hidden><span>処理しています…</span></div>
<div class="toast" id="toast" hidden></div>

<script>
const WD=['日','月','火','水','木','金','土'];
const STATUS={approved:'承認済',pending:'申請中',draft:'下書き',rejected:'差し戻し'};
const NG=/作業したい|進めたい|やりたい|片付けたい|終わらせたい|自主的|作業のため$|作業するため$|特になし|^なし$/;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const md=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}`};
const hm=h=>`${Math.floor(h)}:${pad(Math.round((h%1)*60))}`;
const hrs=h=>(Math.round(h*10)/10).toString();
const ymLabel=ym=>{const [y,m]=ym.split('-');return `${y}年${+m}月`};
const shiftYm=(ym,k)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+k,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const fmtAt=s=>{const m=String(s||'').match(/^\d{4}-(\d{2})-(\d{2}) (\d{2}:\d{2})$/);return m?`${+m[1]}/${+m[2]} ${m[3]}`:(s||'')};

let D=null, members=[], HOL={}, TODAY='', CUR_YM='';
const state={role:'member',tab:'team',view:'cal',ym:'',mid:'',sel:''};
const L=()=>({M:+D.config.LIMIT_M,LAW:+D.config.LAW_M,W:+D.config.LIMIT_W,FURI:+D.config.MIN_FURI,STD:+D.config.STD,STREAK:+D.config.STREAK});
const isOff=s=>{const w=parse(s).getDay();return w===0||w===6||!!HOL[s]};
const isHol=e=>e.kind==='holiday';
const dur=e=>isHol(e)?e.hours:e.end-e.start;
const otOf=e=>isHol(e)?(e.furikae?Math.max(0,e.hours-L().STD):e.hours):e.end-e.start;
const counted=e=>e.status!=='rejected';
const isLocked=ym=>ym<D.lockYm;
const me=()=>members.find(m=>m.id===state.mid)||members[0];
const isSelf=()=>state.mid===D.me.email;
const mgrView=()=>state.role==='mgr';
function reasonCheck(t){
  if(!t) return '理由を書いてください';
  if(t.length<8||NG.test(t)) return '「作業したいので」などの理由は認められません。顧客都合・イベント当日・障害対応など、休日でなければならない理由を書いてください';
  return '';
}

/* ---------- サーバーとのやり取り ---------- */
function call(fn,...args){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args))}
async function run(fn,args,okMsg){
  $('#busy').hidden=false;
  try{const d=await call(fn,...args);load(d);if(okMsg)toast(okMsg);return true}
  catch(e){toast(String((e&&e.message)||e).replace(/^Error:\s*/,''));return false}
  finally{$('#busy').hidden=true}
}
function load(d){
  D=d; HOL=d.holidays||{}; TODAY=d.today; CUR_YM=TODAY.slice(0,7);
  const byTarget={};
  d.comments.forEach(c=>{((byTarget[c.target]=byTarget[c.target]||{})[c.date]=(byTarget[c.target][c.date]||[])).push({who:c.who,mgr:c.mgr,text:c.text,at:fmtAt(c.at)})});
  members=d.members.map(m=>({id:m.email,name:m.name,role:m.role,entries:d.entries.filter(e=>e.email===m.email),comments:byTarget[m.email]||{},avg:{},avgAt:{}}));
  d.avg.forEach(a=>{const m=members.find(x=>x.id===a.email);if(m){m.avg[a.ym]=a.value;m.avgAt[a.ym]=fmtAt(a.at)}});
  if(!state.ym){
    state.ym=CUR_YM; state.sel=TODAY; state.mid=d.me.email;
    if(d.me.role==='manager'){state.role='mgr';state.tab='team'}
    if(window.matchMedia('(max-width:560px)').matches) state.view='list';
  }
  if(d.me.role!=='manager') state.role='member';
  if(!members.some(m=>m.id===state.mid)) state.mid=d.me.email;
  $('#roleseg').hidden=d.me.role!=='manager';
  $('#mem').innerHTML=members.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('');
  syncSeg(); renderAll();
}

/* ---------- 計算 ---------- */
function monthDays(ym){const [y,m]=ym.split('-').map(Number);const out=[];const d=new Date(y,m-1,1);while(d.getMonth()===m-1){out.push(iso(d));d.setDate(d.getDate()+1)}return out}
function weeks(ym){
  const [y,m]=ym.split('-').map(Number);const first=new Date(y,m-1,1),d=new Date(first);d.setDate(1-((first.getDay()+6)%7));
  const out=[];while(true){const w=[];for(let i=0;i<7;i++){w.push(iso(d));d.setDate(d.getDate()+1)}out.push(w);if(d.getMonth()!==m-1)break}return out;
}
const inYm=(ym,s)=>s.slice(0,7)===ym;
const dayEntries=(m,date)=>m.entries.filter(e=>e.date===date);
const furikaeOn=(m,d)=>m.entries.find(e=>isHol(e)&&counted(e)&&e.furikae===d);
function dayLoad(m,date){
  const base=(!isOff(date)&&!furikaeOn(m,date))?(m.avg[date.slice(0,7)]||0):0;
  return base+dayEntries(m,date).filter(counted).reduce((s,e)=>s+otOf(e),0);
}
const weekTotal=(m,ym,w)=>w.filter(s=>inYm(ym,s)).reduce((s,x)=>s+dayLoad(m,x),0);
function isWorking(m,d){
  if(furikaeOn(m,d)) return false;
  if(!isOff(d)) return true;
  return dayEntries(m,d).some(e=>isHol(e)&&counted(e));
}
function maxStreak(m,ym){let best=0,cur=0;monthDays(ym).forEach(d=>{if(isWorking(m,d)){cur++;best=Math.max(best,cur)}else cur=0});return best}
function totals(m,ym){
  const days=monthDays(ym);
  const wdays=days.filter(d=>!isOff(d)&&!furikaeOn(m,d)).length;
  const act=wdays*(m.avg[ym]||0);
  const ents=m.entries.filter(e=>inYm(ym,e.date)&&counted(e));
  const filed=ents.filter(e=>e.status!=='draft').reduce((s,e)=>s+otOf(e),0);
  const draft=ents.filter(e=>e.status==='draft').reduce((s,e)=>s+otOf(e),0);
  const night={approved:0,pending:0,draft:0};
  ents.filter(e=>!isHol(e)).forEach(e=>night[e.status]+=dur(e));
  const hol=ents.filter(isHol);
  const ws=weeks(ym).map(w=>weekTotal(m,ym,w));
  const pending=m.entries.filter(e=>inYm(ym,e.date)&&e.status==='pending').length;
  return {act,filed,draft,total:act+filed+draft,night,nightTotal:night.approved+night.pending+night.draft,
    maxW:Math.max(...ws),overW:ws.filter(x=>x>L().W).length,pending,holDays:hol.length,holNoF:hol.filter(e=>!e.furikae).length,
    streak:maxStreak(m,ym),wdays,noAvg:m.avg[ym]==null};
}

function chip(e,short){
  if(isHol(e)){

    return `<span class="chip st-${e.status} hol" title="${esc(STATUS[e.status]+'：'+e.project)}">${esc(label)}</span>`;
  }
  const label=short?`${hm(e.start)}–${hm(e.end)}`:`${hm(e.start)}–${hm(e.end)} ${e.project}`;
  return `<span class="chip st-${e.status}" title="${esc(STATUS[e.status]+'：'+e.project)}">${esc(label)}</span>`;
}

      const s=+$('#f-start').value,e=+$('#f-end').value;
      if(e<=s){toast('終了は開始より後にしてください');return}
      run('saveEntry',[{kind:'night',date:d,start:s,end:e,project:$('#f-proj').value.trim(),reason:$('#f-reason').value.trim()}],'深夜作業を下書きに追加しました');
    };
  }
  if($('#cform')) $('#cform').onsubmit=ev=>{ev.preventDefault();const t=$('#c-text').value.trim();if(!t)return;run('addComment',[m.id,d,t])};
  $('#panel').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.id));
}

function entryActions(e,mgr){
  if(mgr) return e.status==='pending'&&e.email!==D.me.email?`<button class="btn okb" data-act="approve" data-id="${esc(e.id)}">承認</button><button class="btn badb" data-act="reject" data-id="${esc(e.id)}">差し戻し</button>`:'';
  if(!isSelf()) return '';
  if(e.status==='draft') return `<button class="btn" data-act="del" data-id="${esc(e.id)}">削除</button>`;
  if(e.status==='pending') return `<button class="btn" data-act="withdraw" data-id="${esc(e.id)}">取り下げて下書きに戻す</button>`;
  if(e.status==='rejected') return `<button class="btn" data-act="redo" data-id="${esc(e.id)}">見直して下書きに戻す</button>`;
  return '';
}
function act(a,id){
  if(a==='approve') return run('approveEntry',[id],'承認しました');
  if(a==='reject'){
    const t=$('#c-text')?$('#c-text').value.trim():'';
    if(!t){toast('差し戻しの理由をコメント欄に書いてから押してください');if($('#c-text'))$('#c-text').focus();return}
    return run('rejectEntry',[id,t],'差し戻しました');
  }
  if(a==='del') return run('deleteEntry',[id],'削除しました');
  if(a==='withdraw') return run('withdrawEntry',[id],'取り下げました');
  if(a==='redo') return run('redoEntry',[id],'下書きに戻しました。内容を見直して再申請してください');
}

/* ---------- チーム一覧 ---------- */
function renderTeam(){
  const ym=state.ym, lim=L(), scale=Math.max(50,lim.LAW+5);
  const rows=members.map(m=>({m,t:totals(m,ym)})).sort((a,b)=>b.t.total-a.t.total);
  const pend=rows.reduce((s,r)=>s+r.t.pending,0), over40=rows.filter(r=>r.t.total>lim.M).length,
        near=rows.filter(r=>r.t.total>lim.M*.85&&r.t.total<=lim.M).length,
        overW=rows.filter(r=>r.t.overW).length, noAvg=rows.filter(r=>r.t.noAvg).length;
  $('#summary').className='summary four';
  $('#summary').innerHTML=`
    <div class="tile"><h2>承認待ち</h2><div class="big num${pend?' warn':''}">${pend}<small> 件</small></div><div class="state">${isLocked(ym)?'締め済みの月です':'下のバーから順に開けます'}</div></div>
    <div class="tile"><h2>${lim.M}h超えの見込み</h2><div class="big num${over40?' bad':''}">${over40}<small> 人</small></div><div class="state warn">${near?`あと少しで超える人 ${near}人`:''}</div></div>
    <div class="tile"><h2>週${lim.W}h超えの週がある人</h2><div class="big num${overW?' warn':''}">${overW}<small> 人</small></div></div>
    <div class="tile"><h2>日中残業の見込み 未入力</h2><div class="big num${noAvg?' bad':''}">${noAvg}<small> 人</small></div><div class="state">月初に本人が入力します</div></div>`;
  const pct=v=>Math.min(100,v/scale*100);
  $('#team').innerHTML=`<div class="cal-head"><strong>${ymLabel(ym)}　${esc(D.config.TEAM_NAME||'')}</strong><span class="sub">見込み＝日中の自己申告＋申請（下書き含む）・行を押すと個人のカレンダーを開きます</span></div>
  <div class="tbl-wrap"><table class="team">
    <thead><tr><th>担当者</th><th class="r">日中/日</th><th>残業 見込み（／${lim.M}h）</th><th class="r">深夜</th><th class="r">休日出勤</th><th class="r">最大の週</th><th class="r">承認待ち</th><th>注意</th></tr></thead>
    <tbody>${rows.map(({m,t})=>{
      const lv=t.total>lim.M?'bad':t.total>lim.M*.85?'warn':'';
      const tags=[];
      if(t.total>lim.M) tags.push(`<span class="tag bad">${lim.M}h超え</span>`);
      else if(lv) tags.push(`<span class="tag warn">${lim.M}h間近</span>`);
      if(t.overW) tags.push(`<span class="tag warn">週${lim.W}h超え ${t.overW}週</span>`);
      if(t.noAvg) tags.push(`<span class="tag bad">日中見込み 未入力</span>`);
      if(t.holNoF) tags.push(`<span class="tag warn">振替なし休出 ${t.holNoF}日</span>`);
      if(t.streak>=lim.STREAK) tags.push(`<span class="tag warn">連続勤務 ${t.streak}日</span>`);
      if(!tags.length) tags.push(`<span class="tag ok">問題なし</span>`);
      return `<tr data-m="${esc(m.id)}" tabindex="0">
        <td class="namecell">${esc(m.name)}</td>
        <td class="r num">${m.avg[ym]==null?'—':hrs(m.avg[ym])+'h'}</td>
        <td><div class="ot"><span class="num">${hrs(t.total)}h</span><div class="mini"><div class="fill ${lv}" style="width:${pct(t.total)}%"></div><div class="m40" style="left:${pct(lim.M)}%"></div></div></div></td>
        <td class="r num">${hrs(t.nightTotal)}h</td>
        <td class="r num">${t.holDays?t.holDays+'日':'—'}</td>
        <td class="r num" style="color:${t.maxW>lim.W?'var(--warn)':'inherit'}">${hrs(t.maxW)}h</td>
        <td class="r num">${t.pending||'—'}</td>
        <td><div class="tags">${tags.join('')}</div></td></tr>`;}).join('')}
    </tbody></table></div>`;
  $('#team').querySelectorAll('tr[data-m]').forEach(tr=>{
    const go=()=>{state.mid=tr.dataset.m;state.tab='cal';state.sel=firstSel();syncSeg();renderAll()};
    tr.onclick=go; tr.onkeydown=e=>{if(e.key==='Enter')go()};
  });
}

/* ---------- 下のバーと申請 ---------- */
function renderBar(){
  const lim=L();
  if(mgrView()){
    const list=[];members.forEach(m=>m.entries.filter(e=>e.status==='pending'&&e.email!==D.me.email&&!isLocked(e.date.slice(0,7))).forEach(e=>list.push({m,e})));
    list.sort((a,b)=>a.e.date<b.e.date?-1:1);
    $('#bar').innerHTML=`<span class="msgtxt">チーム全体の承認待ち <b class="num">${list.length}</b> 件</span>${list.length?`<button class="btn primary" id="go-p">次の承認待ちを開く（${esc(list[0].m.name)} ${md(list[0].e.date)}）</button>`:''}`;
    if(list.length) $('#go-p').onclick=()=>{state.mid=list[0].m.id;state.tab='cal';state.ym=list[0].e.date.slice(0,7);state.sel=list[0].e.date;syncSeg();renderAll()};
    return;
  }
  const m=members.find(x=>x.id===D.me.email); if(!m){$('#bar').innerHTML='';return}
  const dr=m.entries.filter(e=>e.status==='draft'&&!isLocked(e.date.slice(0,7)));
  const t=totals(m,state.ym);
  $('#bar').innerHTML=`<span class="msgtxt">下書き <b class="num">${dr.length}</b> 件　${ymLabel(state.ym)}の見込み <b class="num">${hrs(t.total)}h</b> ／ ${lim.M}h</span>
    <button class="btn primary" id="submit" ${dr.length?'':'disabled'}>残業時間を確認してマネージャーに申請</button>`;
  if(dr.length) $('#submit').onclick=()=>openSheet(m,dr);
}

function openSheet(m,dr){
  const lim=L();
  dr=dr.slice().sort((a,b)=>a.date<b.date?-1:1);
  const yms=[...new Set(dr.map(e=>e.date.slice(0,7)))];
  const lines=[]; let need=false;
  yms.forEach(ym=>{
    const t=totals(m,ym), overWs=weeks(ym).filter(w=>weekTotal(m,ym,w)>lim.W);
    if(t.total>lim.M||overWs.length) need=true;
    lines.push(`${ymLabel(ym)}の見込み：<b class="num">${hrs(t.total)}h</b> ／ ${lim.M}h（日中 ${hrs(t.act)}h ＋ 申請 ${hrs(t.filed+t.draft)}h）`);
    overWs.forEach(w=>lines.push(`${md(w.find(s=>inYm(ym,s)))}の週：<b class="num">${hrs(weekTotal(m,ym,w))}h</b>（目安${lim.W}h超え）`));
    if(t.streak>=lim.STREAK) lines.push(`連続勤務が最長 ${t.streak}日 になります`);
  });
  const bad=dr.filter(e=>isHol(e)&&reasonCheck(e.reason));
  const t0=totals(m,yms[0]);
  $('#sheet').innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <h3 id="sh-t">マネージャーに申請する前に確認</h3>
    <table>${dr.map(e=>`<tr><td>${md(e.date)}（${WD[parse(e.date).getDay()]}）${isHol(e)?'休日出勤 ':''}${esc(e.project)}</td><td class="num">${isHol(e)?`${hrs(e.hours)}h　${e.furikae?`→${md(e.furikae)}公休`:'振替なし'}`:`${hm(e.start)}–${hm(e.end)}　${hrs(dur(e))}h`}</td></tr>`).join('')}</table>
    ${bad.length?`<div class="alert" style="background:var(--bad-soft);color:var(--bad)">AIチェック：次の休日出勤は理由が不十分なため申請できません。削除して、理由を具体的にして登録し直してください。<br>${bad.map(e=>`${md(e.date)} ${esc(e.project)}：「${esc(e.reason)}」`).join('<br>')}</div>`:''}
    <div class="alert ${need?'warn':'ok'}">${lines.join('<br>')}</div>
    ${need?`<label for="sh-why" class="sub">基準を超える理由（マネージャーと記録に残ります）</label><textarea id="sh-why" placeholder="例：B案件のリリースとC社の移行が同じ週に重なったため"></textarea>`:''}
    <div class="btns" style="justify-content:flex-end"><button class="btn" id="sh-cancel">戻る</button><button class="btn primary" id="sh-ok" ${bad.length?'disabled':''}>この内容で申請</button></div>
  </div>`;
  $('#sheet').hidden=false;
  $('#sh-cancel').onclick=()=>{$('#sheet').hidden=true};
  $('#sh-ok').onclick=async()=>{
    const why=need?$('#sh-why').value.trim():'';
    if(need&&!why){toast('基準を超える理由を書いてください');$('#sh-why').focus();return}
    const ok=await run('submitDrafts',[dr.map(e=>e.id),why,`${ymLabel(yms[0])}の見込み ${hrs(t0.total)}h／${lim.M}h`],`${dr.length}件をマネージャーに申請しました`);
    if(ok) $('#sheet').hidden=true;
  };
}

let tt;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}

function firstSel(){
  const m=me(), ym=state.ym;
  const p=m.entries.filter(e=>inYm(ym,e.date)&&e.status==='pending').sort((a,b)=>a.date<b.date?-1:1)[0];
  if(p) return p.date;
  return inYm(ym,TODAY)?TODAY:monthDays(ym)[0];
}
function syncSeg(){
  const set=(a,b,on)=>{$(a).setAttribute('aria-pressed',on);$(b).setAttribute('aria-pressed',!on)};
  set('#r-member','#r-mgr',state.role==='member'); set('#t-team','#t-cal',state.tab==='team'); set('#v-cal','#v-list',state.view==='cal');
  $('#mem').value=state.mid;
}
function renderAll(){
  if(!D) return;
  renderHeader();
  if(mgrView()&&state.tab==='team'){renderTeam();renderBar();return}
  renderSummary();
  state.view==='cal'?renderCalendar():renderList();
  renderPanel();renderBar();
  $('#board').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{state.sel=b.dataset.d;renderAll()});
}

$('#mem').onchange=e=>{state.mid=e.target.value;state.sel=firstSel();renderAll()};
$('#r-member').onclick=()=>{state.role='member';state.mid=D.me.email;state.sel=firstSel();syncSeg();renderAll()};
$('#r-mgr').onclick=()=>{state.role='mgr';state.tab='team';syncSeg();renderAll()};
$('#t-team').onclick=()=>{state.tab='team';syncSeg();renderAll()};
$('#t-cal').onclick=()=>{state.tab='cal';state.sel=firstSel();syncSeg();renderAll()};
$('#v-cal').onclick=()=>{state.view='cal';syncSeg();renderAll()};
$('#v-list').onclick=()=>{state.view='list';syncSeg();renderAll()};
$('#m-prev').onclick=()=>{state.ym=shiftYm(state.ym,-1);state.sel=firstSel();renderAll()};
$('#m-next').onclick=()=>{state.ym=shiftYm(state.ym,1);state.sel=firstSel();renderAll()};
$('#reload').onclick=()=>run('getData',[],'最新の内容を読み込みました');

$('#busy').hidden=false;
google.script.run
  .withSuccessHandler(d=>{$('#busy').hidden=true;load(d)})
  .withFailureHandler(e=>{$('#busy').hidden=true;$('#app').hidden=true;$('#fatal').hidden=false;
    $('#fatal').innerHTML=`<h1>開けませんでした</h1><p>${esc(String((e&&e.message)||e).replace(/^Error:\s*/,''))}</p>`})
  .getData();
</script>
