<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// NAKAGAWA RIVER NIGHTS teaser - 2D motion graphics layer (120 BPM, 30 fps, 15 s)
const W = 1920, H = 1080, FPS = 30, BEAT = 0.5;
const C = { bg: '#0A0F26', bg2: '#121A3D', ink: '#F4F6FA', sub: '#9AA6C8', teal: '#4FB3C8', coral: '#FC7D78', amber: '#F0A030' };
const cv = document.getElementById('c'), x = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = v => 1 - Math.pow(1 - v, 3);
const eio = v => v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2;
const beatPulse = t => Math.exp(-((t % BEAT) / BEAT) * 6);
const ring = new Image();
async function loadRing(f) {
  ring.src = `RING/o_${String(f + 1).padStart(4, '0')}.png`;
  await ring.decode().catch(() => {});
}
function txt(s, px, py, font, color, align = 'left', alpha = 1, spacing = 0) {
  x.save(); x.globalAlpha = x.globalAlpha * alpha; x.fillStyle = color; x.font = font; x.textAlign = align; x.textBaseline = 'alphabetic';
  if ('letterSpacing' in x) x.letterSpacing = spacing + 'px';
  x.fillText(s, px, py); x.restore();
}
function maskReveal(t, t0, dur, rx, ry, rw, rh, draw, dir = 1) {
  const p = eo(seg(t, t0, t0 + dur)); if (p <= 0) return;
  x.save(); x.beginPath();
  if (dir > 0) x.rect(rx, ry, rw * p, rh); else x.rect(rx, ry + rh * (1 - p), rw, rh * p);
  x.clip(); draw(p); x.restore();
}
function charsIn(s, t, t0, step, px, py, font, color, align = 'center', spacing = 0) {
  x.save(); x.font = font; if ('letterSpacing' in x) x.letterSpacing = spacing + 'px';
  const total = x.measureText(s).width; x.restore();
  let cx = align === 'center' ? px - total / 2 : px;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i]; const a = eo(seg(t, t0 + i * step, t0 + i * step + .25));
    x.save(); x.font = font; if ('letterSpacing' in x) x.letterSpacing = spacing + 'px';
    const w = x.measureText(ch).width; x.restore();
    txt(ch, cx, py + 14 * (1 - a), font, color, 'left', a, spacing); cx += w;
  }
}
function river(t, yBase, amp, n, color, alphaMul = 1) {
  const draw = eo(seg(t, 0.1, 1.6));
  for (let i = 0; i < n; i++) {
    const y0 = yBase + i * 26, ph = t * 1.2 + i * .6, a = (.12 + .5 * (1 - i / n)) * alphaMul * (0.75 + .25 * beatPulse(t));
    x.save(); x.strokeStyle = color; x.globalAlpha = a; x.lineWidth = i === 0 ? 2.2 : 1.2; x.beginPath();
    const xe = W * draw;
    for (let px = 0; px <= xe; px += 12) {
      const y = y0 + Math.sin(px / 210 + ph) * amp * (1 + i * .12) + Math.sin(px / 77 - ph * 1.7) * 3;
      px === 0 ? x.moveTo(px, y) : x.lineTo(px, y);
    }
    x.stroke(); x.restore();
  }
}
function drawRing(cx, cy, size, alpha = 1) {
  if (!ring.complete || !ring.naturalWidth || alpha <= 0) return;
  x.save(); x.globalAlpha = alpha; x.drawImage(ring, cx - size / 2, cy - size / 2, size, size); x.restore();
}
function hud(t) {
  txt('NAKAGAWA RIVER NIGHTS — TEASER', 64, 64, '700 18px Lato', C.sub, 'left', .9, 4);
  const sec = Math.floor(t), fr = Math.floor((t - sec) * FPS);
  txt(`00:${String(sec).padStart(2, '0')}:${String(fr).padStart(2, '0')}`, W - 64, 64, '400 18px Lato', C.sub, 'right', .9, 3);
  txt('※タイトル・日程は仮', W - 64, H - 52, '500 18px "Zen Kaku Gothic New"', C.sub, 'right', .8);
  // crop marks
  x.save(); x.strokeStyle = C.sub; x.globalAlpha = .5; x.lineWidth = 1.5;
  for (const [px, py, sx, sy] of [[40, 90, 1, 1], [W - 40, 90, -1, 1], [40, H - 40, 1, -1], [W - 40, H - 40, -1, -1]]) {
    x.beginPath(); x.moveTo(px, py + 22 * sy); x.lineTo(px, py); x.lineTo(px + 22 * sx, py); x.stroke();
  }
  x.restore();
}
const WORDS = [['LIVE', C.teal], ['JAZZ', C.coral], ['CIRCUS', C.amber], ['ART', C.ink], ['DJ', C.teal], ['MARCHE', C.coral], ['ON THE RIVER', C.amber]];
const STAGES = [['A', 'KIHINKAN', '貴賓館前ステージ'], ['B', 'HARUYOSHI', '春吉橋ミニステージ'], ['C', 'ON THE WATER', '水上ステージ'], ['D', 'YAKATABUNE', '屋形船クルーズ']];
function render(t) {
  x.fillStyle = C.bg; x.fillRect(0, 0, W, H);
  // soft vertical gradient
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(30,40,100,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  if (t < 5.5) {                                       // ---- S1 + S2
    river(t, 760, 14, 9, C.teal);
    if (t < 2.2) { x.save(); x.globalAlpha = 1 - seg(t, 1.8, 2.15); charsIn('FUKUOKA  ·  NAKA RIVER  ·  SPRING 2027', t, .5, .035, W / 2, 520, '400 30px Lato', C.ink, 'center', 8); x.restore(); }
    const ringIn = eo(seg(t, 1.3, 2.6));
    const sz = 220 + 420 * eo(seg(t, 1.9, 3.0));
        // title behind ring
    maskReveal(t, 2.25, .6, 160, 260, 1100, 190, () => txt('NAKAGAWA', 180, 420, '800 150px "Shippori Mincho"', C.ink, 'left', 1, 6));
    maskReveal(t, 2.55, .6, 300, 440, 1500, 190, () => txt('RIVER NIGHTS', W - 180, 600, '800 150px "Shippori Mincho"', C.ink, 'right', 1, 6));
        drawRing(W / 2, 470, sz, ringIn);
    charsIn('川が、夜のステージになる。', t, 3.6, .07, W / 2, 900, '700 46px "Shippori Mincho"', C.ink, 'center', 10);
    // accent rule
    const rp = eo(seg(t, 3.4, 4.0)); x.save(); x.fillStyle = C.amber; x.fillRect(W / 2 - 120 * rp, 830, 240 * rp, 3); x.restore();
  } else if (t < 9.0) {                                // ---- S3 beat wipes
    const i = Math.min(WORDS.length - 1, Math.floor((t - 5.5) / BEAT)), lt = (t - 5.5) - i * BEAT;
    const [w, col] = WORDS[i];
    const prevCol = i > 0 ? WORDS[i - 1][1] : C.bg;
    x.fillStyle = prevCol; x.fillRect(0, 0, W, H);
    const wp = eo(clamp(lt / .14)); x.fillStyle = col; x.fillRect(0, 0, W * wp, H);
    // stripes
    x.save(); x.globalAlpha = .12; x.fillStyle = C.bg; for (let k = 0; k < 14; k++) x.fillRect(0, k * 80 + ((t * 120) % 80), W, 2); x.restore();
    const dark = col === C.ink ? C.bg : '#0A0F26';
    const sc = 1 + .04 * beatPulse(t);
    x.save(); x.translate(W * .42, H * .58); x.scale(sc, sc);
    txt(w, 0, 0, `900 ${w.length > 8 ? 170 : 250}px Lato`, dark, 'center', eo(clamp((lt - .04) / .1)), 4); x.restore();
    txt(String(i + 1).padStart(2, '0') + ' / 07', 120, H - 120, '700 26px Lato', dark, 'left', .8, 6);
    drawRing(W * .8, H * .45, 420, 1);
  } else if (t < 11.0) {                               // ---- S4 four stages
    river(t + 3, 700, 22, 5, C.teal, .7);
    maskReveal(t, 9.0, .35, 120, 160, 1400, 140, () => txt('4 STAGES ON THE RIVER', 140, 270, '900 96px Lato', C.ink, 'left', 1, 4));
    STAGES.forEach(([k, en, jp], j) => {
      const t0 = 9.0 + j * BEAT, p = eo(seg(t, t0, t0 + .3)); if (p <= 0) return;
      const cx = 300 + j * 440, cy = 700 + Math.sin(cx / 210 + (t + 3) * 1.2) * 22;
      x.save(); x.strokeStyle = [C.teal, C.teal, C.coral, C.amber][j]; x.lineWidth = 3; x.globalAlpha = p;
      x.beginPath(); x.arc(cx, cy, 34 + 60 * (1 - p), 0, Math.PI * 2); x.stroke();
      x.fillStyle = x.strokeStyle; x.beginPath(); x.arc(cx, cy, 26 * p, 0, Math.PI * 2); x.fill(); x.restore();
      txt(k, cx, cy + 12, '900 34px Lato', C.bg, 'center', p);
      txt(en, cx, cy + 110, '700 26px Lato', C.ink, 'center', p, 4);
      txt(jp, cx, cy + 152, '500 24px "Zen Kaku Gothic New"', C.sub, 'center', p);
    });
    drawRing(W - 260, 300, 300, eo(seg(t, 9.0, 9.4)) * .95);
  } else if (t < 13.2) {                               // ---- S5 date
    river(t, 860, 10, 6, C.coral, .5);
    drawRing(470, H / 2, 560, eo(seg(t, 11.0, 11.4)));
    maskReveal(t, 11.1, .4, 860, 330, 1000, 120, () => txt('2027 SPRING', 880, 420, '400 64px Lato', C.amber, 'left', 1, 12));
    maskReveal(t, 11.35, .45, 860, 440, 1100, 170, () => txt('3.14 — 3.22', 870, 580, '900 160px Lato', C.ink, 'left', 1, 2));
    charsIn('SUN                                MON', t, 11.6, .01, 880, 640, '700 28px Lato', C.sub, 'left', 6);
    const rp = eo(seg(t, 11.8, 12.3)); x.save(); x.fillStyle = C.ink; x.fillRect(880, 680, 860 * rp, 2); x.restore();
    charsIn('那珂川　春吉橋〜西大橋エリア　17:30–22:00', t, 12.0, .03, 880, 740, '500 34px "Zen Kaku Gothic New"', C.ink, 'left', 2);
  } else {                                             // ---- S6 end card
    river(t, 820, 12, 9, C.teal, .8);
    const p = eo(seg(t, 13.2, 13.8));
    drawRing(W / 2, 400, 360 + 80 * p, p);
    charsIn('NAKAGAWA RIVER NIGHTS', t, 13.5, .025, W / 2, 720, '800 92px "Shippori Mincho"', C.ink, 'center', 8);
    charsIn('COMING  SOON', t, 14.0, .03, W / 2, 800, '400 32px Lato', C.amber, 'center', 14);
  }
  hud(t);
  // flash on section cuts
  for (const cut of [5.5, 9.0, 11.0, 13.2]) { const f = 1 - seg(t, cut, cut + .12); if (t >= cut && f > 0) { x.save(); x.globalAlpha = f * .35; x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.restore(); } }
  // fades
  const fi = 1 - seg(t, 0, .5), fo = seg(t, 14.5, 15); if (fi > 0 || fo > 0) { x.save(); x.globalAlpha = Math.max(fi, fo); x.fillStyle = '#000'; x.fillRect(0, 0, W, H); x.restore(); }
}
window.drawFrame = async f => { await loadRing(f); render(f / FPS); };
window.ready = (async () => { await document.fonts.load('800 40px "Shippori Mincho"'); await document.fonts.load('900 40px Lato'); await document.fonts.load('400 40px Lato'); await document.fonts.load('700 40px Lato'); await document.fonts.load('500 40px "Zen Kaku Gothic New"'); await document.fonts.load('700 40px "Shippori Mincho"'); })();
</script></body></html>
