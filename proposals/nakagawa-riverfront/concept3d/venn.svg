<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="'Zen Kaku Gothic New', sans-serif">
  <!-- Concept diagram: natural cityscape x stage & culture = cultural landscape -> tourism -->
  <circle cx="130" cy="135" r="112" fill="#1E8C8A" fill-opacity=".14" stroke="#1E8C8A" stroke-width="2.5"/>
  <circle cx="262" cy="135" r="112" fill="#F0A030" fill-opacity=".16" stroke="#F0A030" stroke-width="2.5"/>
  <path d="M196 44.4 A112 112 0 0 1 196 225.6 A112 112 0 0 1 196 44.4 Z" fill="#16181C"/>
  <text x="80" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#16181C">自然都市景観</text>
  <text x="314" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#16181C">作り手が集う</text>
  <text x="314" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#16181C">舞台・文化</text>
  <text x="196" y="130" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF" font-family="'Shippori Mincho', serif">文化</text>
  <text x="196" y="162" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF" font-family="'Shippori Mincho', serif">景観</text>
  <text x="70" y="276" text-anchor="middle" font-size="15" fill="#4A4E55">水面・架かる橋・</text>
  <text x="70" y="298" text-anchor="middle" font-size="15" fill="#4A4E55">水面に映る街の灯り</text>
  <text x="322" y="276" text-anchor="middle" font-size="15" fill="#4A4E55">川の上のステージ・音楽・</text>
  <text x="322" y="298" text-anchor="middle" font-size="15" fill="#4A4E55">パフォーマンス＝遊び心</text>
  <path d="M388 135 H428" stroke="#16181C" stroke-width="2.5"/><path d="M428 127 L442 135 L428 143 Z" fill="#16181C"/>
  <text x="452" y="128" font-size="22" font-weight="700" fill="#16181C">観光へ</text>
  <text x="452" y="156" font-size="22" font-weight="700" fill="#16181C">波及</text>
  <text x="452" y="186" font-size="13" fill="#4A4E55">人が集い、撮り、</text>
  <text x="452" y="206" font-size="13" fill="#4A4E55">語り継ぐ、福岡の</text>
  <text x="452" y="226" font-size="13" fill="#4A4E55">新しい景色</text>
</svg>
